# Alembic configuration for the Cotton Seed Oil Cake Marketplace.
#
# The database URL is intentionally NOT stored here. It is resolved at runtime
# by migrations/env.py in this order (see that file):
#   1. `-x db_url=...` passed on the alembic command line (used by tests/CI)
#   2. the DB_URL environment variable (the same secret the config loader reads)
#   3. the `sqlalchemy.url` option below (a safe local-dev fallback)
#
# This keeps migrations usable against SQLite for local/dev/tests and PostgreSQL
# for runtime, without committing any connection secret (Req 12.5).

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
# Local-dev fallback only; overridden by DB_URL / `-x db_url=...` for runtime.
sqlalchemy.url = sqlite:///./local-dev.db

# Use a timestamped, slug-friendly file name scheme for new revisions.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
